    <style>
        * {
            margin: 1;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        .header {
            background-image: url(https://t4.ftcdn.net/jpg/02/92/20/37/360_F_292203735_CSsyqyS6A4Z9Czd4Msf7qZEhoxjpzZl1.jpg);
            text-align: center;
            padding: 30px 10px;
        }

        .header h1 {
            color: rgb(167, 180, 179);
            font-size: 36px;
        }

        .header p {
            color: rgb(100, 118, 126);
            font-size: 16px;
        }

        .menu-title {
            text-align: center;
            font-size: 24px;
            margin: 20px 0;
            text-decoration: underline,;
        }

        .menu-container {
            width: 90%;
            max-width: 900px;
            margin: auto;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 2px solid #f94a4a;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .menu-left {
            display: flex;
            align-items: center;
        }

        .menu-left img {
            width: 100px;
            height: 120px;
            border-radius: 6px;
            object-fit: cover;
        }

        .menu-text {
            margin-left: 20px;
            font-size: 16px;
        }

        .price {
            font-weight: bold;
            font-size: 20px;
            color: aliceblue;
        }
    </style>
</head>
